<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" />
  <title>NAS桌面助手</title>
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <!-- ============================== 图标库 ============================== -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><path d="M20.8 4v5.2h-5.2" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 15.4a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev-d" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12 8 5.2Z" fill="currentColor"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2.2" fill="currentColor"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><path d="M20.8 4v5.2h-5.2" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12.6 6.6 8.4 13h3.2l-.6 4.6 4.4-6.6h-3.2l.4-4.4Z" fill="currentColor"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M12 2.6 21 7v10L12 21.4 3 17V7l9-4.4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m3.3 7.2 8.7 4.3 8.7-4.3M12 11.5v9.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2.6" y="4" width="18.8" height="12.6" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 20.4h6M12 16.7v3.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6.2" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13.8" width="18" height="6.2" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 7.1h.02M7 16.9h.02" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M11 7.1h4M11 16.9h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 6.8V12l3.6 2.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6.4" y="6.4" width="11.2" height="11.2" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="10" y="10" width="4" height="4" rx="1" fill="currentColor"/><path d="M10 3v3.4M14 3v3.4M10 17.6V21M14 17.6V21M3 10h3.4M3 14h3.4M17.6 10H21M17.6 14H21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><rect x="4.2" y="4.2" width="15.6" height="15.6" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 9h6v6H9z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.6 4.2V2M14.4 4.2V2M9.6 22v-2.2M14.4 22v-2.2M4.2 9.6H2M4.2 14.4H2M22 9.6h-2.2M22 14.4h-2.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="i-ram" viewBox="0 0 24 24"><rect x="2.4" y="7.6" width="19.2" height="8.8" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6.4 16.4v2.2M17.6 16.4v2.2M7 11h1.4M11.3 11h1.4M15.6 11h1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-net" viewBox="0 0 24 24"><path d="M6.5 18.5h11M12 3v13.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="m7.2 8.6 4.8-5.2 4.8 5.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V4.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m5.6 10.8 6.4-6.6 6.4 6.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v15.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m5.6 13.2 6.4 6.6 6.4-6.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-board" viewBox="0 0 24 24"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="7.6" y="7.6" width="8.8" height="8.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 12h.02" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-term" viewBox="0 0 24 24"><rect x="2.8" y="4.2" width="18.4" height="15.6" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m7.4 9.6 2.8 2.6-2.8 2.6M12.6 15h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-temp" viewBox="0 0 24 24"><path d="M10 13.6V5.4a2 2 0 1 1 4 0v8.2a4.2 4.2 0 1 1-4 0Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9.4v7.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </svg>

  <div class="card" id="card" data-view="main">
    <!-- ================================ 标题栏 ================================ -->
    <header class="hd" id="hd">
      <span class="dot" id="dot"></span>
      <div class="hd-txt">
        <div class="name-row">
          <div class="name" id="srvName">未连接</div>
          <!-- 多服务器切换器：点击弹出已保存服务器列表 -->
          <button class="srv-swap" id="btnSwap" title="切换服务器" aria-haspopup="listbox" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="srv-count" id="swapCount" hidden></span>
          </button>
        </div>
        <div class="sub" id="srvSub">请点击右上角齿轮配置服务器</div>
      </div>
      <div class="hd-btn">
        <button class="ic" id="btnRefresh" title="立即刷新"><svg><use href="#i-refresh"/></svg></button>
        <button class="ic" id="btnSettings" title="设置"><svg><use href="#i-gear"/></svg></button>
        <button class="ic" id="btnHide" title="收起为顶部简约条"><svg><use href="#i-minus"/></svg></button>
      </div>

      <!-- 服务器下拉列表（由 JS 填充） -->
      <div class="srv-menu" id="srvMenu" hidden role="listbox" aria-label="服务器列表">
        <div class="srv-menu-hd">已保存的服务器</div>
        <div class="srv-menu-list" id="srvMenuList"></div>
        <button class="srv-menu-add" id="srvMenuAdd" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          添加服务器
        </button>
      </div>
    </header>

    <div class="err" id="err" hidden></div>

    <main class="body" id="body">
      <!-- ========================= 首次配置：添加服务器 ========================= -->
      <section class="onboard" id="onboard" hidden>
        <div class="ob-head">
          <svg class="ob-logo" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="6" y="9" width="36" height="13" rx="3" fill="#4c8dff" opacity=".92"/>
            <rect x="6" y="26" width="36" height="13" rx="3" fill="#4c8dff" opacity=".55"/>
            <circle cx="13" cy="15.5" r="2" fill="#0e1420"/>
            <circle cx="13" cy="32.5" r="2" fill="#0e1420"/>
            <rect x="20" y="14" width="16" height="3" rx="1.5" fill="#0e1420" opacity=".65"/>
            <rect x="20" y="31" width="16" height="3" rx="1.5" fill="#0e1420" opacity=".65"/>
          </svg>
          <div class="ob-title" id="obTitle">添加 Unraid 服务器</div>
          <div class="ob-desc" id="obDesc">填写服务器地址与 API Key，点击「连接测试」验证连通性。测试通过后将自动保存，并进入监控界面。</div>
        </div>

        <div class="ob-form">
          <label class="f-label">服务器类型</label>
          <div class="ob-seg" id="obTypeSeg" role="radiogroup" aria-label="服务器类型">
            <button class="ob-seg-btn is-on" type="button" data-type="unraid" role="radio" aria-checked="true">Unraid</button>
            <button class="ob-seg-btn" type="button" data-type="proxmox" role="radio" aria-checked="false">Proxmox VE</button>
            <button class="ob-seg-btn" type="button" data-type="dsm" role="radio" aria-checked="false">Synology DSM</button>
            <button class="ob-seg-btn" type="button" data-type="fnos" role="radio" aria-checked="false">飞牛 fnOS</button>
          </div>

          <label class="f-label" for="obName">名称 <span class="f-opt">（可选）</span></label>
          <input id="obName" class="f-input" type="text" autocomplete="off" spellcheck="false"
                 placeholder="例如：机房主机 / 塔机" />

          <!-- 一个输入框两用：fnOS 既可填地址、也可直接填 FN ID -->
          <label class="f-label" for="obUrl" id="obUrlLabel">服务器地址</label>
          <input id="obUrl" class="f-input" type="text" autocomplete="off" spellcheck="false"
                 placeholder="http://192.168.1.10  或  https://tower.local" />
          <div class="f-hint" id="obUrlHint" hidden></div>

          <!-- ===== API Key / Token 模式（Unraid / Proxmox VE） ===== -->
          <div id="obKeyBlock">
            <label class="f-label" for="obKey" id="obKeyLabel">API Key</label>
            <div class="f-key">
              <input id="obKey" class="f-input" type="password" autocomplete="off" spellcheck="false"
                     placeholder="Unraid 设置 → 管理访问 → API Keys" />
              <button class="f-eye" id="obEye" type="button" title="显示 / 隐藏">显示</button>
            </div>
          </div>

          <!-- ===== PVE 专用：Token ID（可选，与设置页一致） ===== -->
          <div id="obTokenBlock" hidden>
            <label class="f-label" for="obTokenId">Token ID <span class="f-opt">（可选）</span></label>
            <input id="obTokenId" class="f-input" type="text" autocomplete="off" spellcheck="false"
                   placeholder="root@pam!widget" />
            <div class="f-hint">可留空：此时请把 <code>user@realm!tokenid=secret</code> 整串填到上面的 API Token 框。</div>
          </div>

          <!-- ===== 账号密码模式（Synology DSM） ===== -->
          <div id="obLoginBlock" hidden>
            <label class="f-label" for="obUser">账号</label>
            <input id="obUser" class="f-input" type="text" autocomplete="off" spellcheck="false"
                   placeholder="DSM 登录账号（例如 admin）" />
            <label class="f-label" for="obPass">密码</label>
            <div class="f-key">
              <input id="obPass" class="f-input" type="password" autocomplete="off" spellcheck="false"
                     placeholder="DSM 登录密码" />
              <button class="f-eye" id="obEyePwd" type="button" title="显示 / 隐藏">显示</button>
            </div>
            <label class="f-label" for="obOtp">两步验证码 <span class="f-opt">（可选）</span></label>
            <input id="obOtp" class="f-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false"
                   placeholder="若已开启双重验证则填写 6 位动态码" />
          </div>

          <label class="f-check">
            <input type="checkbox" id="obSelfSigned" checked />
            <span>允许自签名 HTTPS 证书（局域网常见）</span>
          </label>

          <div class="ob-result" id="obResult" hidden></div>

          <button class="ob-btn" id="obTest">连接测试</button>

          <div class="ob-foot">
            <span id="obFootTip">不知道如何获取 API Key？</span>
            <a class="ob-link" id="obDocs" href="https://docs.unraid.net/API/how-to-use-the-api/" target="_blank" rel="noreferrer">查看官方文档</a>
          </div>
        </div>
      </section>

      <!-- ============================= 监控主视图 ============================= -->
      <div id="viewMain" hidden>
        <!-- 核心指标 2×2：CPU / 内存 / 存储 / 实时网络速率 -->
        <section class="metrics">
          <div class="metric">
            <div class="m-lab">CPU</div>
            <div class="m-val" id="cpuVal">—</div>
            <div class="m-foot">
              <svg class="spark" id="cpuSpark" viewBox="0 0 100 18" preserveAspectRatio="none">
                <path class="spark-line" id="cpuLine" d=""/>
              </svg>
              <div class="m-cap" id="cpuCap"></div>
            </div>
          </div>
          <div class="metric">
            <div class="m-lab">内存</div>
            <div class="m-val" id="ramVal">—</div>
            <div class="m-foot">
              <div class="m-bar"><i id="ramBar"></i></div>
              <div class="m-cap" id="ramCap"></div>
            </div>
          </div>
          <div class="metric">
            <div class="m-lab">存储</div>
            <div class="m-val" id="diskVal">—</div>
            <div class="m-foot">
              <div class="m-bar"><i id="diskBar" class="amber"></i></div>
              <div class="m-cap" id="diskCap"></div>
            </div>
          </div>
          <div class="metric">
            <div class="m-lab">网络速率</div>
            <div class="m-foot">
              <div class="net-rows">
                <div class="net-row down">
                  <svg class="ico"><use href="#i-down"/></svg>
                  <span class="k">下载</span>
                  <span class="v" id="netRx">—</span>
                </div>
                <div class="net-row up">
                  <svg class="ico"><use href="#i-up"/></svg>
                  <span class="k">上传</span>
                  <span class="v" id="netTx">—</span>
                </div>
              </div>
              <div class="m-cap" id="netCap"></div>
            </div>
          </div>
        </section>

        <!-- Docker 容器 -->
        <section class="sec" id="secDocker">
          <div class="sec-hd" data-toggle="docker">
            <svg class="ico"><use href="#i-box"/></svg>
            <span class="sec-title">Docker 容器</span>
            <span class="sec-sub" id="dockerSub"></span>
            <svg class="chev"><use href="#i-chev-r"/></svg>
          </div>
          <div class="sec-body" id="dockerList"></div>
        </section>

        <!-- 虚拟机 -->
        <section class="sec" id="secVms">
          <div class="sec-hd" data-toggle="vms">
            <svg class="ico"><use href="#i-monitor"/></svg>
            <span class="sec-title">虚拟机</span>
            <span class="sec-sub" id="vmsSub"></span>
            <svg class="chev"><use href="#i-chev-r"/></svg>
          </div>
          <div class="sec-body" id="vmsList"></div>
        </section>

        <!-- 服务器详情 -->
        <section class="sec" id="secSrv">
          <div class="sec-hd" data-toggle="srv">
            <svg class="ico"><use href="#i-server"/></svg>
            <span class="sec-title">服务器详情</span>
            <span class="sec-sub"></span>
            <svg class="chev"><use href="#i-chev-r"/></svg>
          </div>
          <div class="srv-grid" id="srvGrid"></div>
        </section>
      </div>
    </main>

    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
